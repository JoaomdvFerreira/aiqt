<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 220" width="1080" height="220" role="img" aria-labelledby="aiqt-title aiqt-desc">
  <title id="aiqt-title">AIQT workflow: State to Graph to Work Unit to Agent to Validate to Review</title>
  <desc id="aiqt-desc">AIQT — workflow and governance for AI coding agents. Six-stage pipeline: State, Graph, Work Unit, Agent, Validate, Review.</desc>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="540" y="34" font-size="30" font-weight="700" fill="#0f172a">AIQT</text>
    <text x="540" y="58" font-size="14" fill="#475569">Workflow and governance for AI coding agents</text>

    <!-- connecting arrows drawn first, beneath the pills -->
    <line x1="180" y1="150" x2="200" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="360" y1="150" x2="380" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="540" y1="150" x2="560" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="720" y1="150" x2="740" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="900" y1="150" x2="920" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Pill 1: State -->
    <rect x="20" y="120" width="160" height="60" rx="18" fill="#2563eb"/>
    <text x="100" y="156" font-size="18" font-weight="600" fill="#ffffff">State</text>

    <!-- Pill 2: Graph -->
    <rect x="200" y="120" width="160" height="60" rx="18" fill="#0d9488"/>
    <text x="280" y="156" font-size="18" font-weight="600" fill="#ffffff">Graph</text>

    <!-- Pill 3: Work Unit -->
    <rect x="380" y="120" width="160" height="60" rx="18" fill="#2563eb"/>
    <text x="460" y="156" font-size="18" font-weight="600" fill="#ffffff">Work Unit</text>

    <!-- Pill 4: Agent -->
    <rect x="560" y="120" width="160" height="60" rx="18" fill="#0d9488"/>
    <text x="640" y="156" font-size="18" font-weight="600" fill="#ffffff">Agent</text>

    <!-- Pill 5: Validate -->
    <rect x="740" y="120" width="160" height="60" rx="18" fill="#2563eb"/>
    <text x="820" y="156" font-size="18" font-weight="600" fill="#ffffff">Validate</text>

    <!-- Pill 6: Review -->
    <rect x="920" y="120" width="160" height="60" rx="18" fill="#0d9488"/>
    <text x="1000" y="156" font-size="18" font-weight="600" fill="#ffffff">Review</text>

    <text x="540" y="205" font-size="12" fill="#94a3b8">Each stage is explicit, resumable, and inspectable — never implicit or skipped.</text>
  </g>
</svg>
