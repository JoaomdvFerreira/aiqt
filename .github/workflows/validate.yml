name: Validate

# M19: full repository validation plus version-governance enforcement.
# M21-WU03: matrix-tests the currently supported Node.js runtime range
# (verified live against endoflife.date during M21 Gate A, 2026-07-20:
# Node 20 reached end of security support 2026-04-30 and is EOL; Node 22 is
# Maintenance LTS through 2027-04-30 and Node 24 is Active LTS through
# 2028-04-30). Version-governance enforcement runs once, on the primary
# (highest) supported version, to avoid duplicate merge-gate evaluation.
# Never publishes a package, creates a tag/release, or commits/mutates any
# file -- read-only validation only. Requires no secrets.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          # M19 §18: sufficient history to resolve the PR base and merge
          # base deterministically -- a shallow checkout cannot do this.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # M21-WU10-fix: no `version:` input here. M19-RC1 pinned `version:
        # 7` to match pnpm-lock.yaml's lockfileVersion 5.4 (the format
        # written by pnpm 7.x) -- pnpm 9 rejected that lockfile outright
        # and then failed --frozen-lockfile as if no lockfile existed at
        # all. M21-WU02 later added an exact `packageManager: "pnpm@7.33.5"`
        # to package.json for the same reason (truthful, exact package-
        # manager metadata). pnpm/action-setup@v6 auto-detects the version
        # from `packageManager` when present and *fails outright* if a
        # `version:` input is also given and doesn't byte-for-byte match --
        # this broke the very first CI run after M21-WU02+WU03 merged
        # ("Multiple versions of pnpm specified"), surfaced immediately by
        # this project's real-workflow verification discipline (gh run
        # view). `packageManager` alone is now the single source of truth
        # for both local installs and CI.

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        # M34-WU04: Build now runs before Test (previously the reverse) so
        # tests/integration/built-binary-smoke.test.ts (M34-WU03) has a real
        # dist/index.js to exercise -- CI now validates the artifact it
        # would actually ship, not just source run through tsx.
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Version check (local consistency)
        # M21-WU03: version governance is a single repository-wide policy
        # decision, not a per-runtime one -- it runs once, on the primary
        # (highest) supported Node version, to avoid evaluating the same
        # merge gate twice per push/PR.
        if: matrix.node-version == 24
        run: pnpm version:check

      - name: Fetch PR base branch
        if: matrix.node-version == 24 && github.event_name == 'pull_request'
        # M19 §18: use the pull request's actual base ref from event
        # metadata -- never assume origin/main for every PR.
        run: git fetch origin "${{ github.event.pull_request.base.ref }}":"refs/remotes/origin/${{ github.event.pull_request.base.ref }}"

      - name: Version check (base comparison)
        if: matrix.node-version == 24 && github.event_name == 'pull_request'
        run: pnpm version:check -- --base "origin/${{ github.event.pull_request.base.ref }}" --json

      - name: Resolve direct-push comparison base
        if: matrix.node-version == 24 && github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: resolve_push_base
        # M19-RC1 §12: use GitHub's own authoritative github.event.before
        # (never HEAD~1, which is not authoritative under e.g. a squash
        # merge or force-push) via the single tested decision function in
        # src/tooling/push-base.ts. Exits 1 (failing this step, and the
        # job) if `before` is a non-empty, non-zero SHA that does not
        # resolve -- an anomaly that must not be silently treated as "no
        # previous revision".
        run: node node_modules/tsx/dist/cli.mjs src/tooling/resolve-push-base-cli.ts --before "${{ github.event.before }}" >> "$GITHUB_OUTPUT"

      - name: Version check (direct push to main, enforced)
        if: matrix.node-version == 24 && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.resolve_push_base.outputs.action == 'compare'
        # M19-RC1 §11/§14: this is a blocking merge gate, identical in kind
        # to the PR comparison step below -- no continue-on-error, no
        # `|| true`, no swallowed exit code. A relevant change pushed
        # directly to main without a version bump fails this step, and the
        # job, exactly like a non-compliant PR would.
        run: pnpm version:check -- --base "${{ steps.resolve_push_base.outputs.base }}" --json
