name: Validate

# M19: full repository validation plus version-governance enforcement.
# M35-WU04: Node 24 is the sole mandatory per-commit runtime (the
# Preferred support policy chosen in
# docs/archive/milestones/m35/m35-test-suite-inventory.md Sec 2: "Official
# runtime: Node 24, Node 22: unsupported"). No periodic/scheduled Node 22
# compatibility workflow exists; the Preferred policy explicitly does not
# require one. If Node 22 support is ever reinstated, restore a
# `node-version` matrix and the `matrix.node-version == 24` guards this
# file's original single-job form used to carry.
#
# IH-02 topology change (CI & Test Portfolio Rationalization, see
# docs/infrastructure/active/ci-test-portfolio-rationalization/):
# M35-WU04 had split this workflow into 6 job instances (quality, build,
# 3 test shards, version-check) to reduce *wall-clock* time. The
# optimization target is now *GitHub Actions runner-minutes per safely
# merged change*, and GitHub bills each job rounded up to the whole
# minute. Measured against real completed runs (ih01-baseline.md Sec 3):
#
#   topology            billed runner-min   PR wall-clock
#   6 jobs / 3 shards           18              ~6m05s
#   2 jobs / 2 shards           16              ~7m30s
#   2 jobs / 1 test job         15             ~13m25s
#   1 job (this file)           14             ~13m50s   <- fewest minutes
#
# The 14-minute figure is this topology's cost at the IH-01 baseline's
# test runtime. IH-04 then removes the dominant term inside that runtime
# (per-spawn TypeScript transform in the CLI integration suites), which is
# what takes the single job materially below it.
#
# One job also deletes work that the split topology paid for repeatedly:
# 5 redundant checkout/pnpm-setup/setup-node/install cycles (~64s), the
# dist/ artifact upload + 3 downloads, and 5 of the 6 per-job whole-minute
# rounding remainders (~2.4 min/run). The sequential step order preserves
# the original semantics exactly -- in particular version-check still runs
# only after build *and* test, so a version-governance verdict is never
# reported for a commit whose suite already failed.
#
# Never publishes a package, creates a tag/release, or commits/mutates any
# file -- read-only validation only. Requires no secrets.

on:
  push:
    branches: [main]
  pull_request:

# IH-02: a superseded PR run is pure wasted quota, so cancel in-progress
# runs for the same pull request when a new commit arrives. Pushes to
# `main` are the authoritative post-merge gate and are never cancelled:
# `cancel-in-progress` is evaluated per-event, and the group key falls
# back to `github.ref` (a distinct group from any PR's) for them.
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # M19 §18: full history is required by this job's version-check
          # steps (deterministic PR-base/merge-base resolution, which a
          # shallow checkout cannot do) and by tests that exercise real git
          # history resolution (e.g. tests/unit/push-base.test.ts).
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint

      # Builds dist/ once, in-process, for every consumer that follows:
      # tests/integration/built-binary-smoke.test.ts and version:check's
      # builtRuntimeMatchesPackage check. The split topology moved this
      # same dist/ between jobs as an artifact; one job just keeps it.
      - run: pnpm build

      - run: pnpm test

      - name: Version check (local consistency)
        run: pnpm version:check

      - name: Fetch PR base branch
        if: github.event_name == 'pull_request'
        # M19 §18: use the pull request's actual base ref from event
        # metadata -- never assume origin/main for every PR.
        run: git fetch origin "${{ github.event.pull_request.base.ref }}":"refs/remotes/origin/${{ github.event.pull_request.base.ref }}"

      - name: Version check (base comparison)
        if: github.event_name == 'pull_request'
        run: pnpm version:check -- --base "origin/${{ github.event.pull_request.base.ref }}" --json

      - name: Resolve direct-push comparison base
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: resolve_push_base
        # M19-RC1 §12: use GitHub's own authoritative github.event.before
        # (never HEAD~1, which is not authoritative under e.g. a squash
        # merge or force-push) via the single tested decision function in
        # src/tooling/push-base.ts. Exits 1 (failing this step, and the
        # job) if `before` is a non-empty, non-zero SHA that does not
        # resolve -- an anomaly that must not be silently treated as "no
        # previous revision".
        run: node node_modules/tsx/dist/cli.mjs src/tooling/resolve-push-base-cli.ts --before "${{ github.event.before }}" >> "$GITHUB_OUTPUT"

      - name: Version check (direct push to main, enforced)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.resolve_push_base.outputs.action == 'compare'
        # M19-RC1 §11/§14: this is a blocking merge gate, identical in kind
        # to the PR comparison step above -- no continue-on-error, no
        # `|| true`, no swallowed exit code. A relevant change pushed
        # directly to main without a version bump fails this step, and the
        # job, exactly like a non-compliant PR would.
        run: pnpm version:check -- --base "${{ steps.resolve_push_base.outputs.base }}" --json
