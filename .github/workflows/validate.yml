name: Validate

# M19: full repository validation plus version-governance enforcement.
# M35-WU04: Node 24 is now the sole mandatory per-commit runtime (the
# Preferred support policy chosen in docs/engineering/m35-test-suite-
# inventory.md Sec 2: "Official runtime: Node 24, Node 22: unsupported").
# Node 22 was removed from this workflow's matrix -- it is no longer
# validated on any push or PR. No periodic/scheduled Node 22 compatibility
# workflow was added; the Preferred policy explicitly does not require one.
# If Node 22 support is ever reinstated, restore a `node-version` matrix
# and the `matrix.node-version == 24` guards this file's single-job
# predecessor used to carry.
#
# M35-WU04 topology change: the previous single sequential job (typecheck
# -> lint -> build -> test -> version-check, ~9 minutes wall-clock on
# Node 24 per docs/m34-ci-reliability-confirmation.md) is split into
# parallel jobs so independent GitHub-hosted runners, not one runner's
# CPU budget, absorb the suite's real cost:
#   - quality: typecheck + lint (fast, no build output needed).
#   - build: `pnpm build` once; dist/ is uploaded as an artifact and
#     reused by test/version-check (build spec Sec 7 WU35-04, "reuse
#     build outputs safely") instead of every job rebuilding it.
#   - test: 3-way vitest --shard matrix (build spec Sec 7, "parallelize
#     by workload where beneficial") -- measured locally at 69.5s/83.9s/
#     136.5s per shard (233 files / 2408 tests total, unbalanced by
#     vitest's default file-order sharding, still a large improvement
#     over one ~500s sequential run); each shard needs the dist/
#     artifact since any shard may contain
#     tests/integration/built-binary-smoke.test.ts.
#   - version-check: needs build AND test (preserves the original
#     sequential semantics -- don't report a version-governance verdict
#     if the suite itself already failed) plus the dist/ artifact
#     (runVersionCheck checks builtRuntimeMatchesPackage).
# Never publishes a package, creates a tag/release, or commits/mutates any
# file -- read-only validation only. Requires no secrets.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          # M19 §18: full history retained even in the sharded test job --
          # tests/unit/push-base.test.ts and similar exercise real git
          # history resolution regardless of which shard picks them up.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - run: node node_modules/vitest/vitest.mjs run --shard=${{ matrix.shard }}/3

  version-check:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # M19 §18: sufficient history to resolve the PR base and merge
          # base deterministically -- a shallow checkout cannot do this.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Version check (local consistency)
        run: pnpm version:check

      - name: Fetch PR base branch
        if: github.event_name == 'pull_request'
        # M19 §18: use the pull request's actual base ref from event
        # metadata -- never assume origin/main for every PR.
        run: git fetch origin "${{ github.event.pull_request.base.ref }}":"refs/remotes/origin/${{ github.event.pull_request.base.ref }}"

      - name: Version check (base comparison)
        if: github.event_name == 'pull_request'
        run: pnpm version:check -- --base "origin/${{ github.event.pull_request.base.ref }}" --json

      - name: Resolve direct-push comparison base
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: resolve_push_base
        # M19-RC1 §12: use GitHub's own authoritative github.event.before
        # (never HEAD~1, which is not authoritative under e.g. a squash
        # merge or force-push) via the single tested decision function in
        # src/tooling/push-base.ts. Exits 1 (failing this step, and the
        # job) if `before` is a non-empty, non-zero SHA that does not
        # resolve -- an anomaly that must not be silently treated as "no
        # previous revision".
        run: node node_modules/tsx/dist/cli.mjs src/tooling/resolve-push-base-cli.ts --before "${{ github.event.before }}" >> "$GITHUB_OUTPUT"

      - name: Version check (direct push to main, enforced)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.resolve_push_base.outputs.action == 'compare'
        # M19-RC1 §11/§14: this is a blocking merge gate, identical in kind
        # to the PR comparison step below -- no continue-on-error, no
        # `|| true`, no swallowed exit code. A relevant change pushed
        # directly to main without a version bump fails this step, and the
        # job, exactly like a non-compliant PR would.
        run: pnpm version:check -- --base "${{ steps.resolve_push_base.outputs.base }}" --json
