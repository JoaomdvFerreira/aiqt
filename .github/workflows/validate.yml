name: Validate

# M19: full repository validation plus version-governance enforcement.
# Never publishes a package, creates a tag/release, or commits/mutates any
# file -- read-only validation only. Requires no secrets.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # M19 §18: sufficient history to resolve the PR base and merge
          # base deterministically -- a shallow checkout cannot do this.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # M19-RC1: pinned to match this repository's pnpm-lock.yaml
          # (lockfileVersion: 5.4, the format written by pnpm 7.x). pnpm 9
          # rejects that lockfile outright ("Ignoring not compatible
          # lockfile") and then fails --frozen-lockfile as if no lockfile
          # existed at all -- this broke every CI run since M19 first
          # merged, undetected until M19-RC1's real-workflow verification
          # step (gh run view) surfaced it.
          version: 7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Version check (local consistency)
        run: pnpm version:check

      - name: Fetch PR base branch
        if: github.event_name == 'pull_request'
        # M19 §18: use the pull request's actual base ref from event
        # metadata -- never assume origin/main for every PR.
        run: git fetch origin "${{ github.event.pull_request.base.ref }}":"refs/remotes/origin/${{ github.event.pull_request.base.ref }}"

      - name: Version check (base comparison)
        if: github.event_name == 'pull_request'
        run: pnpm version:check -- --base "origin/${{ github.event.pull_request.base.ref }}" --json

      - name: Resolve direct-push comparison base
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: resolve_push_base
        # M19-RC1 §12: use GitHub's own authoritative github.event.before
        # (never HEAD~1, which is not authoritative under e.g. a squash
        # merge or force-push) via the single tested decision function in
        # src/tooling/push-base.ts. Exits 1 (failing this step, and the
        # job) if `before` is a non-empty, non-zero SHA that does not
        # resolve -- an anomaly that must not be silently treated as "no
        # previous revision".
        run: node node_modules/tsx/dist/cli.mjs src/tooling/resolve-push-base-cli.ts --before "${{ github.event.before }}" >> "$GITHUB_OUTPUT"

      - name: Version check (direct push to main, enforced)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.resolve_push_base.outputs.action == 'compare'
        # M19-RC1 §11/§14: this is a blocking merge gate, identical in kind
        # to the PR comparison step below -- no continue-on-error, no
        # `|| true`, no swallowed exit code. A relevant change pushed
        # directly to main without a version bump fails this step, and the
        # job, exactly like a non-compliant PR would.
        run: pnpm version:check -- --base "${{ steps.resolve_push_base.outputs.base }}" --json
