name: Auto-merge on approval

# Repository development tooling only -- governs how PRs against THIS
# repository merge. Never touches the AIQT CLI product, never creates
# .aiqt/, and never runs product code.
#
# The `approved-for-merge` label (pre-existing, applied by a human) is the
# sole approval signal. This workflow never applies it -- it only reads it
# (to decide whether to merge) and removes it (to make a stale approval
# require re-review after a new commit). All merges are MERGE COMMITS
# only, matching this repository's existing PR-merge convention -- never
# squash, never rebase.
#
# Two independent reasons this job needs to run beyond the moment the
# label is applied:
#   1. The label can be applied while Validate (.github/workflows/
#      validate.yml) is still running -- there is nothing to merge yet.
#   2. Validate can still be running (or fail) after approval, and a
#      human should not have to re-click anything once it turns green.
# The `workflow_run` trigger on Validate's `completed` event is exactly
# GitHub's built-in mechanism for "reconsider when the authoritative CI
# workflow finishes," so no polling, no scheduled trigger, and no second
# workflow re-implementing CI status is needed.
#
# No checkout, no build, no install, no test: this workflow only reads
# GitHub metadata (via `gh`, already present on GitHub-hosted runners) and
# performs the governed merge. Validate remains the sole authority on
# whether the code itself is green.

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_run:
    workflows: ["Validate"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

env:
  GH_TOKEN: ${{ github.token }}
  # No `actions/checkout` step exists in this workflow (deliberately --
  # see the file header), so there is no local git repository for `gh` to
  # infer its target from. Without this, every `gh pr ...` call fails with
  # "fatal: not a git repository" (found live on this exact workflow's
  # first real run against a new commit). GH_REPO makes `gh` target this
  # repository explicitly, independent of any local git state.
  GH_REPO: ${{ github.repository }}
  APPROVAL_LABEL: approved-for-merge
  # The exact check names Validate (.github/workflows/validate.yml)
  # currently registers -- inspected live via `gh pr view --json
  # statusCheckRollup`, not assumed. Update this list only alongside a
  # reviewed change to validate.yml's job/matrix names.
  REQUIRED_CHECKS: "quality,build,test (1),test (2),test (3),version-check"

jobs:
  # Requirement 3: a tracked-content push after approval makes approval
  # stale. Runs only on `synchronize` (a new commit was pushed to the PR
  # head) -- strips the label if present and does nothing else. Never
  # merges here.
  strip-stale-approval:
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    concurrency:
      group: auto-merge-${{ github.event.pull_request.head.ref }}
      cancel-in-progress: false
    steps:
      - name: Remove approved-for-merge if present (new commit invalidates prior approval)
        run: |
          set -euo pipefail
          PR="${{ github.event.pull_request.number }}"
          HAS_LABEL=$(gh pr view "$PR" --json labels --jq \
            '[.labels[].name] | any(. == "'"$APPROVAL_LABEL"'")')
          if [ "$HAS_LABEL" = "true" ]; then
            echo "New commit on PR #$PR -- removing stale $APPROVAL_LABEL label."
            # A concurrent removal (e.g. a human unlabeling at the same
            # moment) is a benign race, not a failure -- don't fail the job
            # over it.
            gh pr edit "$PR" --remove-label "$APPROVAL_LABEL" || \
              echo "Label removal did not apply (already removed?) -- continuing."
          else
            echo "PR #$PR has no $APPROVAL_LABEL label; nothing to strip."
          fi

  # Requirements 4-7: evaluate every live gate from GitHub's own state
  # immediately before merging, and merge only if every gate is proven
  # green. Fails closed on any ambiguous, missing, or non-green signal.
  auto-merge:
    if: >
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'approved-for-merge') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    concurrency:
      group: auto-merge-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Determine candidate PR number(s) and the SHA this run was triggered for
        id: candidates
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "prs=[${{ github.event.pull_request.number }}]" >> "$GITHUB_OUTPUT"
            echo "trigger_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            # workflow_run: the run's own associated PRs (same-repo only,
            # already filtered by the job `if:` above). Re-derive the
            # trigger SHA per PR below -- workflow_run.head_sha is shared
            # across all of them here since GitHub only lists PRs whose
            # head matches this run.
            PRS=$(echo '${{ toJSON(github.event.workflow_run.pull_requests) }}' | jq -c '[.[].number]')
            echo "prs=$PRS" >> "$GITHUB_OUTPUT"
            echo "trigger_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Evaluate each candidate PR and merge only if every gate is green
        env:
          TRIGGER_SHA: ${{ steps.candidates.outputs.trigger_sha }}
          PR_LIST: ${{ steps.candidates.outputs.prs }}
        run: |
          set -euo pipefail

          IFS=',' read -ra EXPECTED_CHECKS <<< "$REQUIRED_CHECKS"

          for PR in $(echo "$PR_LIST" | jq -c '.[]'); do
            echo "::group::PR #$PR"

            VIEW=$(gh pr view "$PR" --json state,isDraft,baseRefName,headRefOid,mergeable,mergeStateStatus,labels,reviewDecision,statusCheckRollup) || {
              echo "Could not fetch PR #$PR state -- failing closed, no merge."
              echo "::endgroup::"
              continue
            }

            STATE=$(echo "$VIEW" | jq -r '.state')
            IS_DRAFT=$(echo "$VIEW" | jq -r '.isDraft')
            BASE_REF=$(echo "$VIEW" | jq -r '.baseRefName')
            HEAD_SHA=$(echo "$VIEW" | jq -r '.headRefOid')
            MERGEABLE=$(echo "$VIEW" | jq -r '.mergeable')
            MERGE_STATE=$(echo "$VIEW" | jq -r '.mergeStateStatus')
            HAS_LABEL=$(echo "$VIEW" | jq -r '[.labels[].name] | any(. == "'"$APPROVAL_LABEL"'")')
            REVIEW_DECISION=$(echo "$VIEW" | jq -r '.reviewDecision // ""')

            echo "state=$STATE isDraft=$IS_DRAFT base=$BASE_REF head=$HEAD_SHA mergeable=$MERGEABLE mergeState=$MERGE_STATE label=$HAS_LABEL review=$REVIEW_DECISION"

            FAIL=""

            [ "$STATE" = "OPEN" ] || FAIL="PR is not OPEN (state=$STATE)"
            [ -n "$FAIL" ] || { [ "$IS_DRAFT" = "false" ] || FAIL="PR is a draft"; }
            [ -n "$FAIL" ] || { [ "$BASE_REF" = "main" ] || FAIL="base is not main (base=$BASE_REF)"; }
            [ -n "$FAIL" ] || { [ "$HAS_LABEL" = "true" ] || FAIL="$APPROVAL_LABEL label is not present"; }
            [ -n "$FAIL" ] || { [ "$MERGEABLE" = "MERGEABLE" ] || FAIL="not mergeable (mergeable=$MERGEABLE)"; }
            [ -n "$FAIL" ] || { [ "$MERGE_STATE" = "CLEAN" ] || FAIL="mergeStateStatus is not CLEAN (mergeStateStatus=$MERGE_STATE)"; }
            [ -n "$FAIL" ] || { [ "$REVIEW_DECISION" != "CHANGES_REQUESTED" ] || FAIL="a review is blocking (CHANGES_REQUESTED)"; }
            [ -n "$FAIL" ] || { [ "$HEAD_SHA" = "$TRIGGER_SHA" ] || FAIL="head moved since this run was triggered (approval is for an older commit)"; }

            if [ -z "$FAIL" ]; then
              for NAME in "${EXPECTED_CHECKS[@]}"; do
                MATCH=$(echo "$VIEW" | jq -r --arg n "$NAME" \
                  '[.statusCheckRollup[]? | select(.name == $n) | (.status == "COMPLETED" and .conclusion == "SUCCESS")] | any')
                if [ "$MATCH" != "true" ]; then
                  FAIL="required check \"$NAME\" is missing, pending, or not successful"
                  break
                fi
              done
            fi

            if [ -n "$FAIL" ]; then
              echo "Not merging PR #$PR: $FAIL"
              echo "::endgroup::"
              continue
            fi

            echo "All gates green for PR #$PR at $HEAD_SHA -- merging with a merge commit."
            gh pr merge "$PR" --merge --match-head-commit "$HEAD_SHA"
            echo "::endgroup::"
          done
