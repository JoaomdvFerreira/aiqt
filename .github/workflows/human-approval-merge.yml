name: Human Approval Merge

# infra/human-approval-auto-merge: the human maintainer is the sole
# authorization source; this workflow performs only the mechanical merge
# action once that authorization is valid for the PR's exact current HEAD.
# See docs/governance/versioning.md's "Merging is human-authorized,
# mechanically automatic" section for the full contract.
#
# Model (deliberately narrower than the label+auto-merge design removed on
# 2026-08-09, see docs/archive/infrastructure/human-approval-auto-merge/):
# `approved-for-merge` is a valid authorization ONLY when applied to a PR
# HEAD for which the authoritative `Validate` workflow has *already*
# succeeded. There is no reconsideration when CI finishes later -- this
# workflow never listens for `Validate`'s completion event. If the label is
# applied while Validate is missing/pending/failed/stale (belongs to a
# different SHA), that authorization is invalid: it is cleared immediately
# and does not queue a merge. A fresh, explicit re-approval is required once
# the HEAD is actually green.
#
# API-only: no checkout, no Node/pnpm install, no build/test, no AI, no
# polling. Every gate is re-read live from the GitHub API immediately before
# any mutation. PR title/body/branch text is never interpolated into a
# shell command -- all PR-controlled text is read through `gh ... --json`
# and compared/parsed only inside `jq`/grep, never `eval`'d or echoed into a
# shell expression.

on:
  pull_request:
    types: [labeled, synchronize]

permissions: {}

concurrency:
  group: human-approval-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # A new commit invalidates any prior approval. Strip the label so the
  # PR's visible state never claims an authorization that no longer applies
  # to the current HEAD.
  strip-stale-approval:
    if: >
      github.event.action == 'synchronize' &&
      contains(github.event.pull_request.labels.*.name, 'approved-for-merge')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Remove stale approved-for-merge label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --remove-label approved-for-merge

  # The label was just applied. Authorization is valid only if Validate has
  # already succeeded for the PR's current HEAD at the moment of this
  # evaluation -- never "will succeed later".
  evaluate-and-merge:
    if: >
      github.event.action == 'labeled' &&
      github.event.label.name == 'approved-for-merge'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Evaluate live gates and merge if eligible
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          fail_closed() {
            echo "::notice::human-approval-merge: blocked -- $1"
            exit 0
          }

          # Live, current PR state -- never the webhook payload, which can
          # already be stale by the time this step runs.
          pr_json="$(gh pr view "$PR_NUMBER" --json state,isDraft,baseRefName,headRefOid,mergeable,mergeStateStatus,reviews,labels,body,number)"

          state="$(jq -r '.state' <<<"$pr_json")"
          if [ "$state" != "OPEN" ]; then
            fail_closed "PR is $state, not OPEN (idempotent no-op)"
          fi

          is_draft="$(jq -r '.isDraft' <<<"$pr_json")"
          if [ "$is_draft" = "true" ]; then
            fail_closed "PR is a draft"
          fi

          base_ref="$(jq -r '.baseRefName' <<<"$pr_json")"
          if [ "$base_ref" != "main" ]; then
            fail_closed "base is '$base_ref', not main"
          fi

          head_sha="$(jq -r '.headRefOid' <<<"$pr_json")"
          if [ -z "$head_sha" ] || [ "$head_sha" = "null" ]; then
            fail_closed "could not resolve current head SHA"
          fi

          has_label="$(jq -r '[.labels[].name] | index("approved-for-merge") != null' <<<"$pr_json")"
          if [ "$has_label" != "true" ]; then
            fail_closed "approved-for-merge is no longer present on the live PR"
          fi

          # Authoritative Validate result for this EXACT head SHA. gh's
          # statusCheckRollup always reflects the current head, so a stale
          # or different-SHA result cannot appear here.
          validate_conclusion="$(gh api "repos/${GH_REPO}/commits/${head_sha}/check-runs" \
            --jq '[.check_runs[] | select(.name == "validate")] | sort_by(.started_at) | last | if . == null then "missing" elif .status != "completed" then "pending" else .conclusion end')"

          if [ "$validate_conclusion" != "success" ]; then
            # Spec-required behavior: approval applied before Validate is
            # green for this HEAD is an INVALID authorization, not a
            # pending one -- clear it and require a fresh explicit
            # re-approval once the HEAD is actually green. Never wait.
            gh pr edit "$PR_NUMBER" --remove-label approved-for-merge || true
            fail_closed "approved-for-merge applied while Validate for $head_sha is '$validate_conclusion' -- cleared, re-approval required once green"
          fi

          # Blocking review state, where GitHub exposes it.
          has_changes_requested="$(jq -r '
            (.reviews // [])
            | group_by(.author.login)
            | map(max_by(.submittedAt))
            | any(.state == "CHANGES_REQUESTED")
          ' <<<"$pr_json")"
          if [ "$has_changes_requested" = "true" ]; then
            fail_closed "an open CHANGES_REQUESTED review remains"
          fi

          mergeable="$(jq -r '.mergeable' <<<"$pr_json")"
          merge_state="$(jq -r '.mergeStateStatus' <<<"$pr_json")"
          if [ "$mergeable" != "MERGEABLE" ] || [ "$merge_state" != "CLEAN" ]; then
            fail_closed "not cleanly mergeable (mergeable=$mergeable, mergeStateStatus=$merge_state)"
          fi

          body="$(jq -r '.body // ""' <<<"$pr_json")"
          risk_line="$(grep -m1 -E '^##[[:space:]]*[^ ]*[[:space:]]*Risk:[[:space:]]*[0-9]+/100[[:space:]]*—[[:space:]]*(GREEN|YELLOW|ORANGE|RED)' <<<"$body" || true)"
          if [ -z "$risk_line" ]; then
            fail_closed "PR body risk header is missing or unparseable"
          fi
          risk_score="$(grep -oE '[0-9]{1,3}/100' <<<"$risk_line" | grep -oE '^[0-9]{1,3}')"
          risk_band="$(grep -oE '(GREEN|YELLOW|ORANGE|RED)' <<<"$risk_line")"
          if [ -z "$risk_score" ] || [ "$risk_score" -gt 100 ]; then
            fail_closed "risk score '$risk_score' failed to parse deterministically"
          fi

          if [ "$risk_band" = "RED" ]; then
            waiver_line="$(grep -m1 -E '^\*\*Waiver:\*\*[[:space:]]*[^[:space:]]' <<<"$body" || true)"
            if [ -z "$waiver_line" ]; then
              fail_closed "Red risk ($risk_score/100) with no non-empty **Waiver:** line -- approved-for-merge alone is not sufficient"
            fi
          fi

          # Immediately before merge: one final live re-read, re-confirming
          # nothing changed between verification above and this mutation.
          recheck_json="$(gh pr view "$PR_NUMBER" --json state,isDraft,headRefOid,mergeable,mergeStateStatus,labels)"
          recheck_head="$(jq -r '.headRefOid' <<<"$recheck_json")"
          recheck_state="$(jq -r '.state' <<<"$recheck_json")"
          recheck_label="$(jq -r '[.labels[].name] | index("approved-for-merge") != null' <<<"$recheck_json")"
          recheck_mergeable="$(jq -r '.mergeable' <<<"$recheck_json")"
          recheck_merge_state="$(jq -r '.mergeStateStatus' <<<"$recheck_json")"
          if [ "$recheck_head" != "$head_sha" ] || [ "$recheck_state" != "OPEN" ] || [ "$recheck_label" != "true" ] \
            || [ "$recheck_mergeable" != "MERGEABLE" ] || [ "$recheck_merge_state" != "CLEAN" ]; then
            fail_closed "PR state changed between verification and merge (head/state/label/mergeability mismatch)"
          fi

          # The exact-HEAD-SHA precondition is the mandatory TOCTOU guard:
          # GitHub rejects the merge if the current head no longer matches.
          gh pr merge "$PR_NUMBER" --merge --match-head-commit "$head_sha"
